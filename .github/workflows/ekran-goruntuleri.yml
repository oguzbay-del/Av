name: Ekran görüntüleri

# Uygulamayı iPhone simülatöründe açıp tanıtım/kontrol için ekran görüntüleri üretir.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/screenshots.sh", ".github/workflows/ekran-goruntuleri.yml"]

jobs:
  screenshots:
    runs-on: macos-15  # Xcode 26 bu imajda kurulu
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç (Liquid Glass)
        run: |
          # macOS imajındaki en yeni Xcode 26'yı seç; yoksa varsayılanla devam et (kod iki SDK ile de derlenir)
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; else echo "::warning::Xcode 26 bulunamadı; cam efektleri olmadan derleniyor"; fi
          xcodebuild -version

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild build -project ios/AvHaritasi.xcodeproj -target AvHaritasi \
            -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -5
      - name: Ekran görüntülerini al
        run: tools/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: screenshots/*.png
          retention-days: 30
