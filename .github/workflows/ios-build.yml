name: iOS derleme

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", "tools/l10n.py", "tools/l10n/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", "tools/l10n.py", "tools/l10n/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15  # Xcode 26 bu imajda kurulu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 seç (Liquid Glass)
        run: |
          # macOS imajındaki en yeni Xcode 26'yı seç; yoksa varsayılanla devam et (kod iki SDK ile de derlenir)
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; else echo "::warning::Xcode 26 bulunamadı; cam efektleri olmadan derleniyor"; fi
          xcodebuild -version

      - name: Xcode bilgisi
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/AvHaritasi.xcodeproj

      - name: Çeviri denetimi (TR/EN)
        run: |
          # Katalog kaynak koddan üretilir; eksik çeviri ya da yerelleştirilmemiş metin varsa durur
          python3 tools/l10n.py --check
          python3 tools/l10n.py
          git diff --exit-code -- ios/AvHaritasi/Localizable.xcstrings ios/AvDurumWidget/Localizable.xcstrings ios/AvSaat/Localizable.xcstrings ios/AvHaritasi/InfoPlist.xcstrings \
            || { echo "::error::Kataloglar güncel değil: python3 tools/l10n.py çalıştırıp commit edin"; exit 1; }

      - name: Simülatör için derle (hata kontrolü)
        run: |
          set -o pipefail
          # -sdk yerine -destination: -sdk tüm hedeflere uygulanır ve gömülü Apple Watch
          # uygulaması (AvSaat) iOS SDK'sıyla derlenmeye çalışılır. Ürünler yine ios/build altında.
          xcodebuild build \
            -project ios/AvHaritasi.xcodeproj \
            -scheme AvHaritasi \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build/DerivedData \
            SYMROOT="$PWD/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee simulator.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" simulator.log

      - name: iPhone için imzasız .ipa üret
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/AvHaritasi.xcodeproj \
            -scheme AvHaritasi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build/DerivedData \
            SYMROOT="$PWD/ios/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/AvHaritasi.app Payload/
          # Apple Watch uygulaması (AvSaat) iPhone uygulamasının içine gömülü olmalı
          test -d Payload/AvHaritasi.app/Watch/AvSaat.app || { echo "::error::Watch/AvSaat.app gömülmemiş"; exit 1; }
          zip -qry AvHaritasi-imzasiz.ipa Payload
          ls -la AvHaritasi-imzasiz.ipa

      - name: .ipa dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: AvHaritasi-imzasiz-ipa
          path: AvHaritasi-imzasiz.ipa
          retention-days: 14

      - name: Derleme kayıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-kayitlari
          path: "*.log"
          retention-days: 7
