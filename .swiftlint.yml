# SwiftLint ayarları — Av Haritası
# Mevcut kod stiline göre gevşetildi; amaç gürültü değil gerçek sorunları yakalamak.
# CI'da (.github/workflows/lint.yml) şimdilik engelleyici değildir.

included:
  - ios/AvHaritasi
  - ios/AvDurumWidget
  - ios/AvSaat
  - ios/Shared

excluded:
  - ios/AvHaritasi/MapData
  - ios/AvHaritasi/Sounds
  - ios/AvHaritasi/Assets.xcassets
  - build
  - DerivedData

disabled_rules:
  - trailing_comma            # çok satırlı dizilerde sondaki virgül serbest
  - todo                      # TODO/FIXME notları uyarı sayılmasın
  - large_tuple               # geometri/kural motorunda (x, y, z) dönüşleri yaygın
  - cyclomatic_complexity     # kural motoru (Assessment) doğası gereği dallı
  - force_cast                # bilinen tiplerle sınırlı kullanım; ileride açılabilir
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - unused_optional_binding

line_length:
  warning: 160
  error: 220
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]
  excluded: [x, y, z, c, d, p, r, i, j, k, n, a, b, t, s, w, h, id, ok, to, lat, lon]

type_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80

type_body_length:
  warning: 600
  error: 1200

file_length:
  warning: 1200
  error: 2500
  ignore_comment_only_lines: true

function_body_length:
  warning: 150
  error: 300

function_parameter_count:
  warning: 8
  error: 12

nesting:
  type_level: 3
  function_level: 5

reporter: "xcode"
